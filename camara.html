<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>Câmara Fria</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      padding: 20px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      font-size: 16px;
      font-weight: 500;
      background: var(--tg-theme-button-color, #0088cc);
      color: var(--tg-theme-button-text-color, #fff);
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    button:active { opacity: 0.9; }
  </style>
</head>
<body>
  <h2>🌡️ Câmara Fria</h2>
  
  <button onclick="runCmd('/temp')">📊 Ver Temperatura</button>
  <button onclick="runCmd('/ledon')">💡 Ligar LED</button>
  <button onclick="runCmd('/ledoff')">⚫ Desligar LED</button>
  <button onclick="runCmd('/ledstatus')">🔍 Status do LED</button>
  
  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    
    function runCmd(cmd) {
      // Envia o comando como se fosse digitado
      tg.sendData(JSON.stringify({ command: cmd }));
      // O Mini App fecha automaticamente após sendData()
    }
  </script>
</body>
</html>
