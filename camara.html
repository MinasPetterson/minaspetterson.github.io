<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>Câmara Fria</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
      padding: 20px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      font-size: 16px;
      font-weight: 500;
      background: var(--tg-theme-button-color, #0088cc);
      color: var(--tg-theme-button-text-color, #fff);
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    button:active { opacity: 0.9; }
    .status { margin-top: 20px; font-size: 14px; opacity: 0.7; }
  </style>
</head>
<body>
  <h2>🌡️ Câmara Fria</h2>
  
  <button onclick="sendCmd('temp')">📊 Ver Temperatura</button>
  <button onclick="sendCmd('ledon')">💡 Ligar LED</button>
  <button onclick="sendCmd('ledoff')">⚫ Desligar LED</button>
  <button onclick="sendCmd('ledstatus')">🔍 Status do LED</button>
  
  <div class="status" id="status">Aguardando ação...</div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Tela cheia
    tg.enableClosingConfirmation(); // Confirma antes de fechar

    function sendCmd(cmd) {
      document.getElementById('status').innerText = 'Enviando...';
      
      // Envia dado estruturado para o bot
      tg.sendData(JSON.stringify({ command: cmd }));
      
      // Opcional: fecha o Mini App após enviar
      // tg.close();
    }
    
    // Feedback visual ao carregar
    window.addEventListener('load', () => {
      document.getElementById('status').innerText = 'Conectado ao bot ✓';
    });
  </script>
</body>
</html>
